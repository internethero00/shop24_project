name: CI/CD Shop24 deploy.yml
on:
  push:
    branches: [ main ]
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server-side/package-lock.json
            client-side/package-lock.json

      # ---------- SERVER ----------
      - name: Install server deps
        working-directory: server-side
        run: npm ci

      - name: Prisma generate (server)
        working-directory: server-side
        run: npx prisma generate

      - name: Test server
        working-directory: server-side
        run: npm run test -- --runInBand

      - name: Build server
        working-directory: server-side
        run: npm run build

      # ---------- CLIENT ----------
      - name: Install deps
        working-directory: client-side
        run: npm ci --include=optional

      - name: Force lightningcss linux binary
        working-directory: client-side
        run: |
          npm i -D lightningcss-linux-x64-gnu
          node -e "require('lightningcss'); console.log('lightningcss ok')"

      - name: Build client
        working-directory: client-side
        run: npm run build
        env:
          SERVER_URL_INTERNAL: http://server:5000


      # ---------- DOCKER (validate dockerfiles) ----------
      - name: Create server-side .env from secrets
        shell: bash
        run: |
          mkdir -p server-side
          cat > server-side/.env <<'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLIENT_URL=${{ vars.CLIENT_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET }}
          YOOKASSA_SHOP_ID=${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }}
          SERVER_URL=${{ vars.SERVER_URL }}
          SERVER_DOMAIN=${{ vars.SERVER_DOMAIN }}
          EOF

      - name: Create client-side .env from secrets
        shell: bash
        run: |
          mkdir -p client-side
          cat > client-side/.env <<'EOF'
          APP_ENV=${{ vars.APP_ENV }}
          APP_URL=${{ vars.APP_URL }}
          APP_DOMAIN=${{ vars.APP_DOMAIN }}
          SERVER_URL_INTERNAL=${{ vars.SERVER_URL_INTERNAL }}
          NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}
          EOF

      - name: Build docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait
        run: sleep 10

      - name: Check server port
        run: curl -f http://localhost:5000/docs || (docker compose logs && exit 1)

      - name: Stop stack
        if: always()
        run: docker compose down -v